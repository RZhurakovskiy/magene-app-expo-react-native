name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      - name: Use stable signing key (so updates install over the old app)
        # prebuild --clean regenerates a RANDOM debug.keystore every run, which
        # changes the APK signature and forces a full uninstall (losing data).
        # Overwrite it with the committed keystore so every build shares one key.
        # No-op until signing/debug.keystore is committed, so the build never
        # fails just because the key isn't there yet.
        run: |
          if [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore android/app/debug.keystore
            echo "Applied committed signing key -> stable signature."
          else
            echo "No committed keystore; using prebuild key (signature not stable)."
          fi

      - name: Build dev-client APK (needs Metro / expo start)
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Build standalone APK (JS bundled, runs without a PC)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Upload dev-client APK
        uses: actions/upload-artifact@v4
        with:
          name: livebeat-devclient-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: livebeat-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
